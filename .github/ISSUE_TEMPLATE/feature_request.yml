name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: platforms
    attributes:
      label: Which platforms does this matter on?
      options:
        - label: Windows
        - label: macOS
        - label: Linux
